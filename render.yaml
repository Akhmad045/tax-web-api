# render.yaml — Blueprint deploy backend FastAPI ke Render (free tier)
#
# Cara pakai:
#   1. Push repo ke GitHub.
#   2. Render Dashboard -> New + -> Blueprint -> pilih repo ini.
#   3. Render membaca file ini dan membuat service otomatis.
#
# Catatan free tier:
#   - Service "spin down" setelah idle; request pertama bisa lambat (cold start).
#   - Filesystem bersifat EPHEMERAL: file SQLite (tax.db) hilang setiap
#     redeploy/restart. Untuk data permanen, tambahkan `disk:` di bawah
#     (butuh paket berbayar) lalu set TAX_DB_PATH ke path disk tersebut.

services:
  - type: web
    name: tax-web-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    # Render otomatis mengisi $PORT. Wajib bind ke 0.0.0.0, bukan 127.0.0.1.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --no-server-header
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Origin frontend yang diizinkan (dipisah koma).
      # Isi env ini agar bisa diubah dari dashboard Render tanpa ubah kode.
      - key: CORS_ORIGINS
        value: https://tim3kalkulatorpajak.web.id,https://www.tim3kalkulatorpajak.web.id,http://localhost:5173
      # Kosongkan/abaikan bila tidak memakai Render Disk.
      # - key: TAX_DB_PATH
      #   value: /var/data/tax.db
      # Secret untuk menandatangani JWT. WAJIB diisi dengan nilai acak sendiri
      # di dashboard Render (Environment). generateValue: true membuat Render
      # membuatkan nilai acak sekali dan menyimpannya permanen.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Masa berlaku token dalam menit (default 480 = 8 jam).
      - key: JWT_EXPIRE_MINUTES
        value: "480"
      # Akun admin default dibuat otomatis saat tabel users masih kosong.
      # WAJIB diisi (sync: false -> diisi manual di dashboard Render) atau
      # generateValue: true. Tanpa nilai, backend TIDAK membuat akun admin
      # (fail closed) — tidak ada lagi password default di dalam kode.
      - key: ADMIN_USERNAME
        value: akhmad23
      - key: ADMIN_PASSWORD
        generateValue: true
      # --- Email (HTTP API Brevo) untuk verifikasi OTP registrasi ---
      # SMTP tidak dipakai karena port 25/465/587 diblokir di Render.
      # Kedua nilai rahasia diset lewat dashboard Render (sync: false).
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER
        sync: false
      # Opsional; default "Tim 3 Kalkulator Pajak" bila tidak diisi.
      # - key: BREVO_SENDER_NAME
      #   value: Tim 3 Kalkulator Pajak
      # Masa berlaku kode OTP dalam menit.
      - key: OTP_TTL_MINUTES
        value: "5"
      # Batas tebakan salah sebelum kode OTP dihapus (anti brute force).
      - key: OTP_MAKS_PERCOBAAN
        value: "5"
    # disk:
    #   name: tax-data
    #   mountPath: /var/data
    #   sizeGB: 1
